<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>关卡 Layout 设计器</title>
<style>
:root { color-scheme: dark; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2127; }
body { font: 13px/1.4 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #d7dae0; }
#canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#canvas.tool-hand, #canvas.space { cursor: grab; }
#canvas.panning { cursor: grabbing; }
#canvas.tool-eraser { cursor: cell; }

.toolbar, .hud {
  position: fixed; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 6px 8px; background: rgba(30, 33, 39, 0.92); border: 1px solid #3a3f4b; border-radius: 8px;
  user-select: none;
}
.toolbar { left: 12px; top: 12px; max-width: calc(100% - 24px); box-sizing: border-box; }
.hud { right: 12px; bottom: 12px; }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.sep { width: 1px; align-self: stretch; background: #3a3f4b; }
.hud span { padding: 0 6px; font-variant-numeric: tabular-nums; }
#hud-zoom { min-width: 48px; text-align: center; }

button {
  min-width: 28px; height: 28px; padding: 0 10px; color: inherit; background: #2c313a;
  border: 1px solid #3a3f4b; border-radius: 5px; cursor: pointer; font: inherit;
}
button:hover { background: #3a3f4b; }
button:focus-visible, .swatch:focus-visible, .custom:focus-within { outline: 2px solid #7aa2f7; outline-offset: 1px; }
button:disabled { opacity: 0.4; cursor: default; }
.tool[aria-pressed="true"] { background: #3d5a99; border-color: #7aa2f7; color: #fff; }

.toolcol {
  position: fixed; left: 12px; top: 64px; width: 60px; box-sizing: border-box; padding: 6px;
  display: flex; flex-direction: column; gap: 4px; align-items: stretch;
  background: rgba(30, 33, 39, 0.92); border: 1px solid #3a3f4b; border-radius: 8px; user-select: none;
  max-height: calc(100% - 140px); overflow-y: auto;
}
.toolcol .tool {
  height: auto; padding: 4px 0 3px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-size: 11px; background: transparent; border-color: transparent;
}
.toolcol .tool:hover { background: #2c313a; }
.toolcol .tool[aria-pressed="true"] { background: #3d5a99; border-color: #7aa2f7; }
.toolcol svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.col-sep { height: 1px; background: #3a3f4b; margin: 2px 0; }
.current-color { display: flex; justify-content: center; padding: 4px 0; }
#current-swatch { width: 28px; height: 28px; border-radius: 6px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); }
.floors {
  position: fixed; left: 12px; bottom: 40px; width: 168px; box-sizing: border-box; padding: 8px;
  display: flex; flex-direction: column; gap: 4px; max-height: max(150px, calc(100% - 570px)); min-height: 0;
  background: rgba(30, 33, 39, 0.94); border: 1px solid #3a3f4b; border-radius: 8px; user-select: none;
}
.floors-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 2px 4px; }
.floors-head .check { font-size: 12px; opacity: 0.8; padding: 0; }
.floor-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
.floors > button, .floors-head { flex: none; }
.floor-row {
  display: flex; justify-content: space-between; align-items: center; height: 30px; padding: 0 10px;
  background: transparent; border-color: transparent; text-align: left;
}
.floor-row:hover { background: #2c313a; }
.floor-row[aria-pressed="true"] { background: #3d5a99; border-color: #7aa2f7; color: #fff; }
.floor-meta { font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
.floor-add { height: 26px; font-size: 12px; background: transparent; border-style: dashed; }
.floor-del { height: 26px; font-size: 12px; margin-top: 4px; }
.floor-del.danger { background: #5a2530; border-color: #d9455f; color: #fff; }
#hud-floor { font-weight: 600; }
.note-editor {
  position: fixed; z-index: 20; width: 280px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
  background: #2a2f38; border: 1px solid #7aa2f7; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.note-editor textarea {
  width: 100%; box-sizing: border-box; resize: vertical; min-height: 72px; padding: 8px; font: inherit; line-height: 1.5;
  color: #3a3220; background: #fff4c2; border: 1px solid #c9a227; border-radius: 5px;
}
.note-editor textarea:focus { outline: 2px solid #7aa2f7; outline-offset: 1px; }
.note-actions { display: flex; gap: 6px; align-items: center; }
.note-actions .spacer { flex: 1; }
.note-actions .primary { background: #3d5a99; border-color: #7aa2f7; color: #fff; }
.danger-text { color: #ff8a8a; }
.tool-options {
  position: fixed; left: 80px; top: 64px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  background: rgba(30, 33, 39, 0.94); border: 1px solid #3a3f4b; border-radius: 8px; user-select: none;
}
.opt-col { display: flex; flex-direction: column; gap: 8px; }
.opt-row { display: flex; align-items: center; gap: 6px; }
.opt-label { width: 32px; opacity: 0.7; }
.icon-name { font-weight: 600; }
.icon-grid { display: grid; grid-template-columns: repeat(6, 30px); gap: 4px; max-height: 240px; overflow-y: auto; }
.icon-grid button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; border-radius: 6px; }
.icon-grid button[aria-pressed="true"] { border-color: #7aa2f7; background: #2c3a57; }
.icon-grid canvas, .icon-grid img { width: 24px; height: 24px; object-fit: contain; pointer-events: none; }
#icon-rename { flex: 1; min-width: 0; }
#icon-size { width: 44px; }
.image-options { width: 220px; box-sizing: border-box; }
.image-options .opt-tip { font-size: 12px; opacity: 0.6; margin-left: auto; }
.image-options input[type="range"] { flex: 1; min-width: 0; accent-color: #7aa2f7; }
.image-options .opt-num { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.image-options .spacer { flex: 1; }
.legend {
  position: fixed; right: 12px; top: 12px; width: 232px; max-height: calc(100% - 96px);
  display: flex; flex-direction: column; box-sizing: border-box;
  background: rgba(30, 33, 39, 0.94); border: 1px solid #3a3f4b; border-radius: 8px;
}
.legend-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 12px; gap: 8px; }
.legend-head button { height: 24px; padding: 0 8px; font-size: 12px; }
.legend.collapsed .legend-body { display: none; }
.legend-body { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 10px; min-height: 0; }
.legend-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
.legend-row {
  display: grid; grid-template-columns: 24px 1fr 14px 22px; align-items: center; gap: 8px;
  padding: 4px 4px 4px 6px; border-radius: 6px; border: 1px solid transparent; cursor: pointer;
}
.legend-row:hover { background: #2a2f38; }
.legend-row.selected { background: #2c3a57; border-color: #7aa2f7; }
.legend-swatch {
  position: relative; width: 24px; height: 24px; border-radius: 5px; overflow: hidden; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
}
.legend-swatch:focus-within { outline: 2px solid #7aa2f7; outline-offset: 1px; }
.legend-swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.legend-name {
  min-width: 0; height: 24px; padding: 0 6px; font: inherit; color: inherit; background: transparent;
  border: 1px solid transparent; border-radius: 4px;
}
.legend-name:hover { border-color: #3a3f4b; }
.legend-name:focus { outline: none; border-color: #7aa2f7; background: #1e2127; }
.legend-key { font-size: 11px; opacity: 0.5; text-align: center; font-variant-numeric: tabular-nums; }
.legend-del { min-width: 22px; width: 22px; height: 22px; padding: 0; background: transparent; border-color: transparent; opacity: 0.5; }
.legend-row:hover .legend-del { opacity: 1; }
.legend-del:hover { background: #4a2a30; }
.legend-actions { display: flex; gap: 6px; }
.legend-actions button { flex: 1; height: 28px; padding: 0 6px; }
.legend-tip { margin: 0; font-size: 12px; line-height: 1.5; opacity: 0.6; }
.project-name {
  width: 120px; height: 28px; padding: 0 8px; box-sizing: border-box; font: inherit; color: inherit;
  background: #1e2127; border: 1px solid #3a3f4b; border-radius: 5px;
}
.project-name:focus { outline: none; border-color: #7aa2f7; }
select {
  height: 28px; padding: 0 6px; font: inherit; color: inherit; background: #2c313a;
  border: 1px solid #3a3f4b; border-radius: 5px; cursor: pointer;
}
.stroke input {
  width: 44px; height: 28px; box-sizing: border-box; padding: 0 4px; text-align: center; font: inherit; color: inherit;
  background: #1e2127; border: 1px solid #3a3f4b; border-radius: 5px;
}
.stroke input:focus { outline: none; border-color: #7aa2f7; }
.stroke button { min-width: 26px; padding: 0; }
.seg { display: inline-flex; margin-right: 6px; }
.seg button { padding: 0 10px; border-radius: 0; }
.seg button:first-child { border-radius: 5px 0 0 5px; }
.seg button:last-child { border-radius: 0 5px 5px 0; border-left: 0; }
.seg button[aria-pressed="true"] { background: #3d5a99; border-color: #7aa2f7; color: #fff; }
.check { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; padding: 0 4px; }
.hint {
  position: fixed; left: 50%; top: 64px; transform: translateX(-50%); padding: 5px 12px; border-radius: 6px;
  background: rgba(30, 33, 39, 0.92); border: 1px solid #3a3f4b; pointer-events: none; white-space: nowrap;
}
.toast {
  position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 8px 14px; border-radius: 8px; background: #2c313a; border: 1px solid #3a3f4b; box-sizing: border-box;
}
.toast.error { border-color: #d9455f; background: #3a2328; }
.help { position: fixed; left: 196px; bottom: 12px; opacity: 0.6; user-select: none; pointer-events: none; }
@media (max-width: 760px) { .help { display: none; } }
@media (max-width: 640px) {
  .toolbar { flex-wrap: nowrap; overflow-x: auto; right: 12px; }
  .project-name { width: 96px; flex: none; }
  .toolbar .group { flex-wrap: nowrap; flex: none; }
  .toolbar button { flex: none; }
  .legend { top: auto; bottom: 64px; max-height: 50%; }
  .floors { bottom: auto; top: 420px; max-height: calc(100% - 500px); width: 140px; }
  .hint { top: auto; bottom: 112px; white-space: normal; max-width: calc(100% - 100px); }
}
.icon-legend { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #3a3f4b; padding-top: 8px; }
.icon-legend-list { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }
.icon-legend-row { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 8px; padding: 2px 4px 2px 6px; }
.icon-legend-row canvas, .icon-legend-row img { width: 20px; height: 20px; object-fit: contain; }
.icon-legend-row input { min-width: 0; background: transparent; border: 1px solid transparent; color: inherit; font: inherit; padding: 3px 4px; border-radius: 4px; }
.icon-legend-row input:hover, .icon-legend-row input:focus { border-color: #4a5060; background: #1e2127; outline: none; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal-box {
  width: min(420px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px;
  background: #23272e; border: 1px solid #3a3f4b; border-radius: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  max-height: 100%; overflow-y: auto;
}
.modal-box h2 { margin: 0 0 4px; font-size: 16px; }
.modal-box .field { display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 8px; }
.modal-box .field span { opacity: 0.75; }
.modal-box select { width: 100%; min-width: 0; }
.modal-box .checks { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.modal-tip { margin: 0; font-size: 12px; opacity: 0.7; min-height: 1em; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
    <div class="toolbar" id="toolbar">
      <div class="group">
        <input id="project-name" class="project-name" type="text" value="未命名关卡" aria-label="工程名称" title="工程名称（也是导出的文件名）" />
        <button id="btn-export" title="把当前关卡导出为工程文件 (Ctrl+S)">导出</button>
        <button id="btn-import" title="打开之前导出的工程文件 (Ctrl+O)">导入</button>
        <button id="btn-export-image" title="把楼层导出成 PNG 图片，底部带颜色和图标说明 (Ctrl+Shift+S)">导出图片</button>
        <input id="file-import" type="file" accept=".json,application/json" hidden />
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="btn-image" title="导入一张参考图垫在格子下面（也可以直接把图片拖进画布，或 Ctrl+V 粘贴截图）">参考图</button>
        <input id="file-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="btn-undo" title="撤销 (Ctrl+Z)">撤销</button>
        <button id="btn-redo" title="重做 (Ctrl+Shift+Z)">重做</button>
        <button id="btn-clear" title="清空当前楼层（可撤销）">清空</button>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="btn-lang" title="切换语言" aria-label="切换语言">EN</button>
      </div>
    </div>
    <nav class="toolcol" id="toolcol" aria-label="工具">
      <button id="tool-select" class="tool" data-tool="select" title="框选：拖框选中，拖动移动；Delete 删除 (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4M12 4h4M20 4v4M20 12v4M4 8v4M4 16v4h4" stroke-dasharray="0"/><path d="M12 11l8 3-3.5 1.5L15 19z"/></svg><span>框选</span></button>
      <button id="tool-brush" class="tool" data-tool="brush" title="画笔 (B)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c2 0 4-1 4-3a2 2 0 0 0-4 0c0 1-.5 2-1 3z"/><path d="M9.5 15.5 20 5a1.4 1.4 0 0 0-2-2L7.5 13.5"/></svg><span>画笔</span></button>
      <button id="tool-eraser" class="tool" data-tool="eraser" title="橡皮 (E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 20 -4-4 10-10 7 7-7 7z"/><path d="M8 11l7 7"/><path d="M12 20h8"/></svg><span>橡皮</span></button>
      <button id="tool-arc" class="tool" data-tool="arc" title="弧线：设定起点和终点，再调弯曲 (A)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18C4 10 9 5 12 5s8 5 8 13"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="18" r="1.6"/></svg><span>弧线</span></button>
      <button id="tool-shape" class="tool" data-tool="shape" title="几何图形 (G)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="9" height="9" rx="1"/><circle cx="16" cy="8" r="5"/></svg><span>图形</span></button>
      <button id="tool-note" class="tool" data-tool="note" title="备注：点击画布添加文字备注 (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/><path d="M8 9h8M8 12h5"/></svg><span>备注</span></button>
      <button id="tool-icon" class="tool" data-tool="icon" title="图标：楼梯、宝箱、陷阱、记录点等，点击画布放置 (I)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 16h3v-3h3v-3h3"/></svg><span>图标</span></button>
      <button id="tool-hand" class="tool" data-tool="hand" title="平移 (H，或按住空格拖拽)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 14a1.5 1.5 0 0 1 2.5-1.6L8 15"/></svg><span>平移</span></button>
      <div class="col-sep"></div>
      <div class="current-color" title="当前颜色（在右侧颜色说明里切换）"><span id="current-swatch"></span></div>
    </nav>
    <section class="floors" id="floors" aria-label="楼层">
      <div class="floors-head">
        <strong>楼层</strong>
        <label class="check" title="是否半透明显示其他楼层"><input id="floor-show-others" type="checkbox" checked /> 显示其他层</label>
      </div>
      <button id="floor-add-up" class="floor-add" title="在最上面加一层">+ 上加一层</button>
      <div id="floor-list" class="floor-list"></div>
      <button id="floor-add-down" class="floor-add" title="在最下面加一层（地下层）">+ 下加一层</button>
      <button id="floor-del" class="floor-del" title="删除当前楼层（不可撤销）">删除当前层</button>
    </section>
    <div class="tool-options" id="tool-options" hidden>
      <div id="shape-options" class="opt-row" hidden>
        <label class="opt-label" for="shape-kind">图形</label>
        <select id="shape-kind"></select>
        <label class="check" title="勾选后内部也填满颜色"><input id="shape-fill" type="checkbox" /> 填充</label>
      </div>
      <div id="sides-row" class="opt-row stroke" hidden title="正多边形的边数（3–64）">
        <span class="opt-label">边数</span>
        <button id="sides-dec" aria-label="减少边数">−</button>
        <input id="shape-sides" type="number" min="3" max="64" step="1" value="5" aria-label="多边形边数" />
        <button id="sides-inc" aria-label="增加边数">+</button>
        <span>边</span>
      </div>
      <div id="icon-options" class="opt-col" hidden>
        <div class="opt-row"><span class="opt-label">图标</span><strong id="icon-name" class="icon-name"></strong></div>
        <div id="icon-grid" class="icon-grid" role="group" aria-label="选择图标"></div>
        <div id="icon-custom-row" class="opt-row" hidden>
          <input id="icon-rename" type="text" maxlength="40" aria-label="自定义图标名称" title="修改这个自定义图标的名字" />
          <button id="icon-remove" class="danger-text" title="从图标库移除（画布上已放的不受影响）">移除</button>
        </div>
        <div class="opt-row">
          <button id="icon-import" title="用自己的图片（PNG / SVG / JPG / WebP）做图标，可一次选多张">+ 导入图标</button>
          <input id="file-icon" type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp,image/gif" multiple hidden />
        </div>
        <div class="opt-row" title="图标边长，单位是当前笔刷格子">
          <span class="opt-label">大小</span>
          <button id="icon-dec" aria-label="缩小图标">−</button>
          <input id="icon-size" type="number" min="1" max="20" step="1" value="2" aria-label="图标大小（格）" />
          <button id="icon-inc" aria-label="放大图标">+</button>
          <span>格</span>
        </div>
      </div>
      <div id="stroke-options" class="opt-col stroke" hidden>
        <div class="opt-row">
          <span class="opt-label">模式</span>
          <span class="seg" role="group" aria-label="绘制模式">
            <button id="mode-cells" title="按格子逐格填色">格子</button>
            <button id="mode-smooth" title="平滑的矢量线条，放大也顺滑">平滑</button>
          </span>
        </div>
        <div id="arrow-row" class="opt-row" hidden title="在线条的起点、终点或两端加箭头">
          <label class="opt-label" for="arrow-mode">箭头</label>
          <select id="arrow-mode"></select>
        </div>
        <div class="opt-row" title="线条粗细，单位是当前笔刷格子（[ 和 ] 键调整）">
          <span class="opt-label">粗细</span>
          <button id="stroke-dec" aria-label="变细">−</button>
          <input id="stroke-width" type="number" min="1" max="99" step="1" value="1" aria-label="线条粗细（格）" />
          <button id="stroke-inc" aria-label="变粗">+</button>
          <span>格</span>
        </div>
      </div>
    </div>
    <div class="tool-options image-options" id="image-options" hidden>
      <div class="opt-row"><strong>参考图</strong><span class="opt-tip">拖动移动 · 拖右下角缩放</span></div>
      <div class="opt-row" title="参考图的不透明度">
        <span class="opt-label">透明</span>
        <input id="image-opacity" type="range" min="5" max="100" step="1" value="50" aria-label="参考图不透明度" />
        <span id="image-opacity-text" class="opt-num">50%</span>
      </div>
      <div class="opt-row">

          <span class="spacer"></span>
          <button type="button" id="export-cancel">取消</button>
          <button type="submit" id="export-go" class="primary">导出</button>
        </div>
