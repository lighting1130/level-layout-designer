<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关卡 Layout 设计器</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="toolbar" id="toolbar">
      <div class="group">
        <input id="project-name" class="project-name" type="text" value="未命名关卡" aria-label="工程名称" title="工程名称（也是导出的文件名）" />
        <button id="btn-export" title="把当前关卡导出为工程文件 (Ctrl+S)">导出</button>
        <button id="btn-import" title="打开之前导出的工程文件 (Ctrl+O)">导入</button>
        <input id="file-import" type="file" accept=".json,application/json" hidden />
      </div>
      <div class="sep"></div>
      <div class="group" role="group" aria-label="工具">
        <button id="tool-brush" class="tool" data-tool="brush" title="画笔 (B)">画笔</button>
        <button id="tool-eraser" class="tool" data-tool="eraser" title="橡皮 (E)">橡皮</button>
        <button id="tool-arc" class="tool" data-tool="arc" title="弧线：设定起点和终点，再调弯曲 (A)">弧线</button>
        <button id="tool-shape" class="tool" data-tool="shape" title="几何图形 (G)">图形</button>
        <span id="shape-options" class="group" hidden>
          <select id="shape-kind" aria-label="图形类型"></select>
          <label class="check" title="勾选后内部也填满颜色"><input id="shape-fill" type="checkbox" /> 填充</label>
        </span>
        <span id="stroke-options" class="group stroke" hidden title="弧线和图形的线条粗细，单位是当前笔刷格子（[ 和 ] 键调整）">
          <span class="seg" role="group" aria-label="绘制模式">
            <button id="mode-cells" title="按格子逐格填色">格子</button>
            <button id="mode-smooth" title="平滑的矢量线条，放大也顺滑">平滑</button>
          </span>
          <span>粗细</span>
          <button id="stroke-dec" aria-label="变细">−</button>
          <input id="stroke-width" type="number" min="1" max="99" step="1" value="1" aria-label="线条粗细（格）" />
          <button id="stroke-inc" aria-label="变粗">+</button>
          <span>格</span>
        </span>
        <button id="tool-hand" class="tool" data-tool="hand" title="平移 (H，或按住空格拖拽)">平移</button>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="btn-undo" title="撤销 (Ctrl+Z)">撤销</button>
        <button id="btn-redo" title="重做 (Ctrl+Shift+Z)">重做</button>
        <button id="btn-clear" title="清空画布（可撤销）">清空</button>
      </div>
    </div>
    <aside class="legend" id="legend" aria-label="颜色说明">
      <div class="legend-head">
        <strong>颜色说明</strong>
        <button id="legend-toggle" aria-expanded="true" title="收起/展开">收起</button>
      </div>
      <div class="legend-body">
        <div id="legend-list" class="legend-list"></div>
        <div class="legend-actions">
          <button id="legend-add" title="添加一个新颜色">+ 添加颜色</button>
          <button id="legend-reset" title="恢复默认的颜色和说明（不影响已画的格子）">恢复默认</button>
        </div>
        <p class="legend-tip">点色块改颜色，点文字改说明。改颜色时，画布上用这个颜色的格子会一起变。</p>
      </div>
    </aside>
    <div class="hint" id="hint" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="hud">
      <span id="hud-brush">笔刷: 1 格</span>
      <span id="hud-cell">格子: 0, 0</span>
      <span id="hud-zoom">100%</span>
      <button id="btn-zoom-out" title="缩小 (-)">−</button>
      <button id="btn-zoom-in" title="放大 (+)">+</button>
      <button id="btn-reset" title="回到原点 (0)">复位</button>
    </div>
    <div class="help">左键涂色 · 空格/右键/中键拖拽平移 · 滚轮缩放（放大后笔刷自动变细） · 右侧点颜色或按 1-9 选色</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
